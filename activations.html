<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>activations</title>
<style>
:root{
  --ink:#1a4d8f;
  --ink-2:#2360ae;
  --ink-tint:#eaf1fa;
  --c0:#c04a4a;
  --bg:#f4f6f9;
  --card:#ffffff;
  --track:#edf0f4;
  --stroke:rgba(16,24,40,.08);
  --stroke-2:rgba(16,24,40,.05);
  --tx:#101828;
  --tx-2:#5b6472;
  --tx-3:#98a1af;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 1px 2px rgba(16,24,40,.05),0 10px 26px -14px rgba(16,24,40,.30);
  --sh-3:0 16px 40px -10px rgba(16,24,40,.20),0 2px 8px rgba(16,24,40,.07);
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --r-card:16px;
  --r:11px;
  --r-sm:9px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{font:400 15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,select,input{font-family:inherit}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--stroke-2)}
#tabs{display:flex;gap:4px;padding:10px 20px}
#tabs button{
  font:600 14px/1 var(--ui);letter-spacing:.005em;color:var(--tx-2);
  background:transparent;border:0;padding:10px 16px;border-radius:var(--r);
  cursor:pointer;transition:background .16s ease,color .16s ease}
#tabs button:hover{background:rgba(16,24,40,.045);color:var(--tx)}
#tabs button.on{background:var(--ink-tint);color:var(--ink)}

main{padding:16px 20px 22px}

/* ---------- control card ---------- */
.ctl{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-card);
  box-shadow:var(--sh-2);padding:11px 14px;margin-bottom:16px;
  display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.ctl.plain{background:none;border:0;box-shadow:none;padding:0;margin:0 0 12px}
.grp{display:flex;align-items:center;gap:9px;min-width:0}
.lbl{font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx-3);white-space:nowrap}
.div{width:1px;height:26px;background:var(--stroke-2);margin:0 2px}
.spacer{flex:1 1 auto}

.seg{display:inline-flex;background:var(--track);border-radius:var(--r);padding:3px;gap:2px;
  box-shadow:inset 0 1px 2px rgba(16,24,40,.05)}
.seg button{
  font:500 13px/1 var(--mono);padding:7px 11px;border:0;background:transparent;
  color:var(--tx-2);cursor:pointer;border-radius:var(--r-sm);white-space:nowrap;
  transition:background .14s ease,color .14s ease,box-shadow .14s ease}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(16,24,40,.13),0 0 0 .5px rgba(16,24,40,.04)}
.seg button.sm{font-size:11.5px;padding:6px 9px}

.btn{font:500 13px/1 var(--ui);padding:10px 15px;border:1px solid var(--stroke);
  border-radius:var(--r);background:var(--card);color:var(--tx);cursor:pointer;
  box-shadow:var(--sh-1);transition:transform .12s ease,box-shadow .14s ease,background .14s ease;
  white-space:nowrap}
.btn:hover{box-shadow:0 3px 10px -2px rgba(16,24,40,.16);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:var(--sh-1)}
.btn.on{background:linear-gradient(180deg,var(--ink-2),var(--ink));color:#fff;
  border-color:rgba(16,24,40,.12);box-shadow:0 3px 12px -2px rgba(26,77,143,.45)}
.btn.sm{font-size:12px;padding:8px 12px}

.sld{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:132px;height:22px;
  background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--track);
  border-radius:99px;box-shadow:inset 0 1px 2px rgba(16,24,40,.07)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  margin-top:-5px;border-radius:99px;background:#fff;border:1.5px solid var(--ink);
  box-shadow:0 1px 4px rgba(16,24,40,.22)}
.sld .v{font:500 13px/1 var(--mono);color:var(--tx);min-width:46px;
  font-variant-numeric:tabular-nums}

label.rad{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font:500 13px/1 var(--ui);color:var(--tx-2);padding:8px 11px;border-radius:var(--r-sm);
  transition:.14s ease}
label.rad:hover{color:var(--tx);background:rgba(16,24,40,.04)}
label.rad:has(input:checked){color:var(--ink);background:var(--ink-tint)}
label.rad input{accent-color:var(--ink);width:13px;height:13px;margin:0}

select{font:500 13px/1 var(--ui);color:var(--tx);cursor:pointer;appearance:none;
  padding:10px 32px 10px 13px;border:1px solid var(--stroke);border-radius:var(--r);
  box-shadow:var(--sh-1);
  background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%235b6472' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 12px center}
select:hover{box-shadow:0 3px 10px -2px rgba(16,24,40,.16)}

.seedv{font:500 13px/1 var(--mono);color:var(--tx-3);letter-spacing:.02em}

/* ---------- page 1 ---------- */
#grid1{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-card);
  box-shadow:var(--sh-2);padding:12px 14px 11px;display:flex;flex-direction:column;min-width:0}
.ptitle{font:italic 400 20px/1 var(--serif);color:var(--tx);padding:0 0 8px 2px}
canvas.pc{display:block;width:100%}

.row{display:flex;align-items:center;gap:13px;margin-top:9px;min-width:0}
.pair{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.k{font:600 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3)}
.v{font:600 16px/1 var(--mono);color:var(--tx);font-variant-numeric:tabular-nums}
.v.e{min-width:70px}
.v.a{min-width:36px}
.v.l{min-width:98px}
.bar{flex:1 1 auto;min-width:44px;height:14px;border-radius:99px;background:var(--track);
  box-shadow:inset 0 1px 2px rgba(16,24,40,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--ink-2),var(--ink))}

/* ---------- page 2 ---------- */
#page2{display:none;gap:16px;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr)}
#page2.on{display:grid}
@media (max-width:1120px){#page2{grid-template-columns:minmax(0,1fr)}}
.col{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--stroke-2);border-radius:var(--r-card);
  box-shadow:var(--sh-2);padding:14px 16px}
canvas.wide{display:block;width:100%}
.readline{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:12px}
.bars3{display:flex;gap:16px;align-items:center;margin-top:10px}
.bars3 .u{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.dead.hot .v{color:var(--c0)}
#p2out{font:500 13px/1 var(--mono);color:var(--ink);
  background:var(--ink-tint);padding:8px 11px;border-radius:var(--r-sm)}
#p2out:empty{display:none}

.menu{position:absolute;z-index:40;display:none;min-width:158px;padding:6px;
  background:var(--card);border:1px solid var(--stroke-2);border-radius:14px;
  box-shadow:var(--sh-3)}
.menu button{display:block;width:100%;text-align:left;border:0;cursor:pointer;
  font:500 13.5px/1 var(--mono);padding:10px 12px;background:none;color:var(--tx);
  border-radius:var(--r-sm);transition:background .12s ease}
.menu button:hover{background:rgba(16,24,40,.045)}
.menu button.on{color:var(--ink);background:var(--ink-tint);font-weight:600}
</style>
</head>
<body>

<header>
  <nav id="tabs">
    <button id="tab1" class="on">Perceptron</button>
    <button id="tab2">Network</button>
  </nav>
</header>

<main>
<section id="page1">
  <div class="ctl">
    <div class="grp"><span class="lbl">Scenario</span>
      <span class="seg"><button data-sc="0" class="on">A</button><button data-sc="1">B</button></span></div>
    <div class="grp"><span class="lbl">Epochs / frame</span><span class="seg" id="dial1"></span></div>
    <div class="grp">
      <button class="btn" id="play1">Play</button>
      <button class="btn" id="pause1">Pause</button>
      <button class="btn" id="reset1">Reset</button></div>
    <div class="grp"><span class="lbl">View</span>
      <span class="seg">
        <button data-v="0" class="on">boundary</button>
        <button data-v="1">loss vs epoch</button>
        <button data-v="2">loss bowl</button>
        <button data-v="3" class="sm">loss slice</button></span></div>
    <span class="div"></span>
    <div class="sld"><span class="lbl">Initial b</span>
      <input type="range" id="sb" min="-20" max="20" step="0.1"><span class="v" id="sbv"></span></div>
    <div class="sld"><span class="lbl">Alpha</span>
      <input type="range" id="sa" min="0.001" max="0.5" step="0.001"><span class="v" id="sav"></span></div>
  </div>
  <div id="grid1"></div>
</section>

<section id="page2">
  <div class="col">
    <div class="ctl">
      <div class="grp"><span class="lbl">Epochs / frame</span><span class="seg" id="dial2"></span></div>
      <div class="grp">
        <button class="btn" id="play2">Play</button>
        <button class="btn" id="pause2">Pause</button>
        <button class="btn" id="reset2">Reset</button></div>
      <span class="div"></span>
      <div class="grp"><span class="lbl">Preset</span>
        <span class="seg">
          <button data-pre="0">all sigmoid</button>
          <button data-pre="1">all relu</button>
          <button data-pre="2">one dead relu</button>
          <button data-pre="3">mixed</button></span></div>
      <div class="grp"><span class="lbl">Loss</span>
        <label class="rad"><input type="radio" name="lt" value="0" checked>MSE</label>
        <label class="rad"><input type="radio" name="lt" value="1">MAE</label>
        <label class="rad"><input type="radio" name="lt" value="2">BCE</label></div>
      <div class="grp"><span class="lbl">Data</span>
        <select id="ds"><option value="0">xor blobs</option><option value="1">concentric circles</option></select></div>
      <div class="grp">
        <button class="btn sm" id="reseed">reseed</button>
        <button class="btn sm" id="run10">run 10 seeds</button></div>
      <span id="p2out"></span>
      <span class="spacer"></span>
      <span class="seedv" id="seedv"></span>
    </div>
    <div class="card">
      <canvas class="wide" id="diag"></canvas>
      <div class="readline">
        <span class="pair"><span class="k">ep</span><span class="v e" id="p2e"></span></span>
        <span class="pair"><span class="k">acc</span><span class="v a" id="p2a"></span></span>
        <span class="pair"><span class="k">loss</span><span class="v l" id="p2l"></span></span>
        <span class="pair dead" id="p2dead"><span class="k">dead</span><span class="v" id="p2d"></span></span>
      </div>
      <div class="bars3" id="p2bars"></div>
    </div>
  </div>
  <div class="col">
    <div class="card"><canvas class="wide" id="surf"></canvas></div>
    <div class="card"><canvas class="wide" id="lstrip"></canvas></div>
  </div>
</section>
</main>

<div class="menu" id="menu"></div>

<script>
/*<CORE>*/
globalThis.CORE=(function(){
'use strict';

/* ---------- seeded PRNG ---------- */
function mulberry32(a){
  a=a>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0;
    var t=a;
    t=Math.imul(t^(t>>>15),1|t);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function gaussFrom(rng){
  var spare=null;
  return function(){
    if(spare!==null){var s=spare;spare=null;return s;}
    var u=0,v=0;
    do{u=rng();}while(u<=1e-12);
    v=rng();
    var m=Math.sqrt(-2*Math.log(u)),ang=2*Math.PI*v;
    spare=m*Math.sin(ang);
    return m*Math.cos(ang);
  };
}

/* ---------- activations + hardcoded undecided level ---------- */
var ATANH_HALF=0.5493061443340548;
var ACTS=[
 {name:'threshold',f:function(z){return z>0?1:0;},           fp:function(z){return 0;},                                     zs:0.0},
 {name:'sigmoid',  f:function(z){return 1/(1+Math.exp(-z));},fp:function(z){var s=1/(1+Math.exp(-z));return s*(1-s);},      zs:0.0},
 {name:'tanh',     f:function(z){return Math.tanh(z);},      fp:function(z){var t=Math.tanh(z);return 1-t*t;},              zs:ATANH_HALF},
 {name:'relu',     f:function(z){return z>0?z:0;},           fp:function(z){return z>0?1:0;},                               zs:0.5},
 {name:'leaky',    f:function(z){return z>0?z:0.01*z;},      fp:function(z){return z>0?1:0.01;},                            zs:0.5},
 {name:'elu',      f:function(z){return z>0?z:Math.exp(z)-1;},fp:function(z){return z>0?1:Math.exp(z);},                    zs:0.5}
];
var AI={};for(var _i=0;_i<ACTS.length;_i++)AI[ACTS[_i].name]=_i;

/* ---------- data ---------- */
var SEED1=136;
function makeData1(seed){
  var rng=mulberry32(seed),g=gaussFrom(rng),n=120,i;
  var X1=new Float64Array(n),X2=new Float64Array(n),Y=new Float64Array(n);
  for(i=0;i<60;i++){X1[i]=-2+0.6*g();X2[i]=-2+0.6*g();Y[i]=0;}
  for(i=60;i<120;i++){X1[i]=2+0.6*g();X2[i]=2+0.6*g();Y[i]=1;}
  return {X1:X1,X2:X2,Y:Y,n:n};
}
function makeXOR(seed){
  var rng=mulberry32(seed),g=gaussFrom(rng),n=120,k=0,c,i;
  var X1=new Float64Array(n),X2=new Float64Array(n),Y=new Float64Array(n);
  var C=[[2,2,1],[-2,-2,1],[2,-2,0],[-2,2,0]];
  for(c=0;c<4;c++)for(i=0;i<30;i++){
    X1[k]=C[c][0]+0.5*g();X2[k]=C[c][1]+0.5*g();Y[k]=C[c][2];k++;
  }
  return {X1:X1,X2:X2,Y:Y,n:n};
}
function makeCircles(seed){
  var rng=mulberry32(seed),g=gaussFrom(rng),n=120,i;
  var X1=new Float64Array(n),X2=new Float64Array(n),Y=new Float64Array(n);
  for(i=0;i<n;i++){
    var inner=i<60,r=(inner?0.9:3.0)+0.22*g(),th=2*Math.PI*rng();
    X1[i]=r*Math.cos(th);X2[i]=r*Math.sin(th);Y[i]=inner?0:1;
  }
  return {X1:X1,X2:X2,Y:Y,n:n};
}

/* ---------- page 1 : single perceptron ---------- */
function p1Make(ai,w1,w2,b,alpha){return {ai:ai,w1:w1,w2:w2,b:b,alpha:alpha,epoch:0};}
function p1Grad(m,D,out){
  var A=ACTS[m.ai],f=A.f,fp=A.fp,n=D.n,X1=D.X1,X2=D.X2,Y=D.Y;
  var w1=m.w1,w2=m.w2,b=m.b,g1=0,g2=0,g3=0,i;
  for(i=0;i<n;i++){
    var x1=X1[i],x2=X2[i];
    var z=w1*x1+w2*x2+b;
    var d=(f(z)-Y[i])*fp(z);
    g1+=d*x1;g2+=d*x2;g3+=d;
  }
  out[0]=g1/n;out[1]=g2/n;out[2]=g3/n;
  return out;
}
function p1Step(m,D,out){
  p1Grad(m,D,out);
  m.w1-=m.alpha*out[0];m.w2-=m.alpha*out[1];m.b-=m.alpha*out[2];
  m.epoch++;
  return out;
}
function p1Run(m,D,N,out){for(var k=0;k<N;k++)p1Step(m,D,out);}
/* ONE shared loss function: readout, history, bowl and slice all call this */
function p1Loss(ai,w1,w2,b,D){
  var f=ACTS[ai].f,n=D.n,X1=D.X1,X2=D.X2,Y=D.Y,s=0,i;
  for(i=0;i<n;i++){var e=f(w1*X1[i]+w2*X2[i]+b)-Y[i];s+=0.5*e*e;}
  return s/n;
}
function p1SliceAt(m,D,bs){return p1Loss(m.ai,m.w1,m.w2,bs,D);}
function p1Acc(ai,w1,w2,b,D){
  var zs=ACTS[ai].zs,n=D.n,X1=D.X1,X2=D.X2,Y=D.Y,c=0,i;
  for(i=0;i<n;i++){var z=w1*X1[i]+w2*X2[i]+b;if(((z>zs)?1:0)===Y[i])c++;}
  return c/n;
}
function p1MinZ(m,D){
  var n=D.n,mz=Infinity,i;
  for(i=0;i<n;i++){var z=m.w1*D.X1[i]+m.w2*D.X2[i]+m.b;if(z<mz)mz=z;}
  return mz;
}
function gradBarFrac(g){
  if(!(g>0))return 0;
  var t=(Math.log(g)/Math.LN10+16)/17;
  return t<0?0:(t>1?1:t);
}
function bowlMarker(loss,loss0){
  var p=(loss0>0)?loss/loss0:0;
  if(!(p>0))p=0;
  if(p>1)p=1;
  return {x:-Math.sqrt(p),y:p};
}

/* ---------- page 2 : 2-3-1 network ---------- */
var LOSSN=['MSE','MAE','BCE'],LO=1e-12,HI=1-1e-12;
function lossVal(t,yh,y){
  if(t===0){var e=yh-y;return 0.5*e*e;}
  if(t===1)return Math.abs(yh-y);
  return -(y*Math.log(yh)+(1-y)*Math.log(1-yh));
}
function lossDer(t,yh,y){
  if(t===0)return yh-y;
  if(t===1){var e=yh-y;return e>0?1:(e<0?-1:0);}
  return (yh-y)/(yh*(1-yh));
}
function netNew(seed,acts,lossType,alpha){
  var rng=mulberry32(seed),u=function(){return rng()*2-1;};
  var W1=[[u(),u()],[u(),u()],[u(),u()]];
  var b1=[u(),u(),u()];
  var W2=[u(),u(),u()];
  var b2=u();
  return {W1:W1,b1:b1,W2:W2,b2:b2,acts:acts.slice(),lossType:lossType,alpha:alpha,epoch:0};
}
function netG(){return {W1:[[0,0],[0,0],[0,0]],b1:[0,0,0],W2:[0,0,0],b2:0};}
function gz(G){
  G.W1[0][0]=0;G.W1[0][1]=0;G.W1[1][0]=0;G.W1[1][1]=0;G.W1[2][0]=0;G.W1[2][1]=0;
  G.b1[0]=0;G.b1[1]=0;G.b1[2]=0;G.W2[0]=0;G.W2[1]=0;G.W2[2]=0;G.b2=0;
}
var SZ=new Float64Array(3),SA=new Float64Array(3);
/* one sweep: metrics at the CURRENT weights, gradients into G */
function netEval(net,D,G,probe){
  var n=D.n,acts=net.acts,W1=net.W1,b1=net.b1,W2=net.W2;
  var loss=0,corr=0,a0=false,a1=false,a2=false,i,j;
  if(G)gz(G);
  for(i=0;i<n;i++){
    var x1=D.X1[i],x2=D.X2[i],y=D.Y[i],z2=net.b2;
    for(j=0;j<3;j++){
      var z=W1[j][0]*x1+W1[j][1]*x2+b1[j];
      SZ[j]=z;
      var av=ACTS[acts[j]].f(z);
      SA[j]=av;
      z2+=W2[j]*av;
    }
    if(SA[0]>0)a0=true;if(SA[1]>0)a1=true;if(SA[2]>0)a2=true;
    var yr=1/(1+Math.exp(-z2));
    var yh=yr<LO?LO:(yr>HI?HI:yr);
    loss+=lossVal(net.lossType,yh,y);
    if(((yh>0.5)?1:0)===y)corr++;
    if(G){
      var dz2=lossDer(net.lossType,yh,y)*yh*(1-yh);
      if(probe)probe.push([dz2,yh-y]);
      G.b2+=dz2;
      for(j=0;j<3;j++){
        G.W2[j]+=dz2*SA[j];
        var d1=dz2*W2[j]*ACTS[acts[j]].fp(SZ[j]);
        G.W1[j][0]+=d1*x1;G.W1[j][1]+=d1*x2;G.b1[j]+=d1;
      }
    }
  }
  var gb=[0,0,0];
  if(G){
    for(j=0;j<3;j++){
      G.W1[j][0]/=n;G.W1[j][1]/=n;G.b1[j]/=n;G.W2[j]/=n;
      gb[j]=(Math.abs(G.W1[j][0])+Math.abs(G.W1[j][1]))/2;
    }
    G.b2/=n;
  }
  return {loss:loss/n,acc:corr/n,dead:(a0?0:1)+(a1?0:1)+(a2?0:1),gbar:gb};
}
function netApply(net,G){
  var a=net.alpha,j;
  for(j=0;j<3;j++){
    net.W1[j][0]-=a*G.W1[j][0];net.W1[j][1]-=a*G.W1[j][1];
    net.b1[j]-=a*G.b1[j];net.W2[j]-=a*G.W2[j];
  }
  net.b2-=a*G.b2;
  net.epoch++;
}
function netStep(net,D,G){var r=netEval(net,D,G);netApply(net,G);return r;}
function netRun(net,D,N,G){for(var k=0;k<N;k++)netStep(net,D,G);}
function netFwd(net,x1,x2){
  var z2=net.b2,j;
  for(j=0;j<3;j++)z2+=net.W2[j]*ACTS[net.acts[j]].f(net.W1[j][0]*x1+net.W1[j][1]*x2+net.b1[j]);
  return 1/(1+Math.exp(-z2));
}

/* ---------- invariants ---------- */
function runAssertions(env){
  env=env||{};
  var R=[],out=[0,0,0],out2=[0,0,0],i,e;
  function T(n,pass,note){R.push({n:n,pass:!!pass,note:note||''});}
  var D=makeData1(SEED1);
  var SC=[{w1:1,w2:1,b:12,a:0.05,name:'A'},{w1:0.5,w2:0.5,b:-3,a:0.05,name:'B'}];

  /* 1 - threshold gradient is exactly zero, both scenarios, weights never move */
  (function(){
    var bad=0,moved=0;
    for(var s=0;s<2;s++){
      var m=p1Make(AI.threshold,SC[s].w1,SC[s].w2,SC[s].b,SC[s].a);
      for(e=0;e<5000;e++){
        p1Step(m,D,out);
        if(out[0]!==0||out[1]!==0||out[2]!==0)bad++;
      }
      if(!(m.w1===SC[s].w1&&m.w2===SC[s].w2&&m.b===SC[s].b))moved++;
    }
    T(1,bad===0&&moved===0,'5000 epochs x 2 scenarios; nonzero-gradient epochs='+bad+'; scenarios whose weights moved='+moved);
  })();

  /* 2 - scenario B relu is dead: gradient exactly zero, weights frozen */
  (function(){
    var m=p1Make(AI.relu,SC[1].w1,SC[1].w2,SC[1].b,SC[1].a);
    var w0=[m.w1,m.w2,m.b],bad=0,N=env.deepTest?3000000:50000;
    for(e=0;e<N;e++){
      p1Step(m,D,out);
      if(out[0]!==0||out[1]!==0||out[2]!==0)bad++;
    }
    var fixed=(m.w1===w0[0]&&m.w2===w0[1]&&m.b===w0[2]);
    T(2,bad===0&&fixed,N.toLocaleString('en-US')+' epochs; nonzero-gradient epochs='+bad+'; w=('+m.w1+','+m.w2+','+m.b+') bit-identical to epoch 0. step() is a bitwise fixed point, so epoch 3,000,000 prints the same.');
  })();

  /* 3 - scenario A: relu and leaky bit-identical until the first negative z */
  (function(){
    var mr=p1Make(AI.relu,SC[0].w1,SC[0].w2,SC[0].b,SC[0].a);
    var ml=p1Make(AI.leaky,SC[0].w1,SC[0].w2,SC[0].b,SC[0].a);
    var div=-1,bad=0;
    for(e=0;e<400000;e++){
      if(p1MinZ(mr,D)<=0){div=e;break;}
      if(!(mr.w1===ml.w1&&mr.w2===ml.w2&&mr.b===ml.b)){bad=1;div=e;break;}
      p1Step(mr,D,out);p1Step(ml,D,out2);
    }
    T(3,bad===0&&div>0,'weights bit-identical for every epoch before the first z<=0, which first occurs at epoch '+div);
  })();

  /* 4 - tanh'(z) === 4*sigmoid'(2z) */
  (function(){
    var zs=[0,1,1.663,3,6,12],worst=0;
    for(i=0;i<zs.length;i++){
      var d=Math.abs(ACTS[AI.tanh].fp(zs[i])-4*ACTS[AI.sigmoid].fp(2*zs[i]));
      if(d>worst)worst=d;
    }
    T(4,worst<=1e-12,'max |tanh′(z) - 4·σ′(2z)| over z in {0,1,1.663,3,6,12} = '+worst.toExponential(3));
  })();

  /* 5 - the dial cannot change the arithmetic */
  (function(){
    var bad=0,names=[];
    for(var a=0;a<ACTS.length;a++){
      for(var s=0;s<2;s++){
        var m1=p1Make(a,SC[s].w1,SC[s].w2,SC[s].b,SC[s].a);
        var m2=p1Make(a,SC[s].w1,SC[s].w2,SC[s].b,SC[s].a);
        for(e=0;e<20000;e++)p1Step(m1,D,out);
        p1Run(m2,D,20000,out2);
        if(!(m1.w1===m2.w1&&m1.w2===m2.w2&&m1.b===m2.b)){bad++;names.push(ACTS[a].name+SC[s].name);}
      }
    }
    T(5,bad===0,'20,000 epochs across 12 activation/scenario pairs: one-at-a-time and single-chunk weights bit-identical'+(bad?' FAILED: '+names.join(','):''));
  })();

  /* 6 - bowl marker lies on the parabola; slice marker equals the loss readout */
  (function(){
    var worstB=0,worstS=0,ps=[1,0.999,0.75,0.5,0.3125,0.1,1e-3,1e-7,0],k;
    for(k=0;k<ps.length;k++){
      var mk=bowlMarker(ps[k],1);
      var d=Math.abs(mk.y-mk.x*mk.x);
      if(d>worstB)worstB=d;
    }
    for(var a=0;a<ACTS.length;a++){
      for(var s=0;s<2;s++){
        var m=p1Make(a,SC[s].w1,SC[s].w2,SC[s].b,SC[s].a);
        var L0=p1Loss(a,SC[s].w1,SC[s].w2,SC[s].b,D);
        for(e=0;e<300;e++){
          p1Step(m,D,out);
          var readout=p1Loss(m.ai,m.w1,m.w2,m.b,D);
          var mk2=bowlMarker(readout,L0);
          var db=Math.abs(mk2.y-mk2.x*mk2.x);
          if(db>worstB)worstB=db;
          var ds=Math.abs(p1SliceAt(m,D,m.b)-readout);
          if(ds>worstS)worstS=ds;
        }
      }
    }
    T(6,worstB<=1e-12&&worstS<=1e-12,'max |markerY - markerX²| = '+worstB.toExponential(3)+' over 3612 frames; max |slice(b) - loss readout| = '+worstS.toExponential(3));
  })();

  /* 7 - switching view leaves epoch and weights untouched (needs the live UI) */
  (function(){
    if(typeof env.viewProbe!=='function'){T(7,false,'SKIPPED - no DOM (headless run); browser run tests this live');return;}
    var r=env.viewProbe();
    T(7,r.ok,r.note);
  })();

  /* 8 - BCE + sigmoid output: dL/dz2 === (yhat - y) */
  (function(){
    var Dx=makeXOR(4242),G=netG(),worst=0,t,n=0;
    for(t=0;t<4;t++){
      var net=netNew(900+t,[AI.relu,AI.sigmoid,AI.elu],2,0.5);
      netRun(net,Dx,25,G);
      var probe=[];
      netEval(net,Dx,G,probe);
      for(i=0;i<probe.length;i++){
        var d=Math.abs(probe[i][0]-probe[i][1]);
        if(d>worst)worst=d;
        n++;
      }
    }
    T(8,worst<=1e-10,'max |dL/dz₂ - (ŷ - y)| over '+n+' samples = '+worst.toExponential(3));
  })();

  /* 9 - uniform hidden layer: permuting units + weights leaves the loss unchanged */
  (function(){
    var Dx=makeXOR(4242),G=netG(),worst=0,perm=[2,0,1],a,t,n=0;
    for(a=0;a<ACTS.length;a++){
      for(t=0;t<3;t++){
        var net=netNew(51+t,[a,a,a],t,0.5);
        netRun(net,Dx,40,G);
        var L1=netEval(net,Dx,null).loss;
        var q={W1:[net.W1[perm[0]],net.W1[perm[1]],net.W1[perm[2]]],
               b1:[net.b1[perm[0]],net.b1[perm[1]],net.b1[perm[2]]],
               W2:[net.W2[perm[0]],net.W2[perm[1]],net.W2[perm[2]]],
               b2:net.b2,acts:[a,a,a],lossType:t,alpha:net.alpha,epoch:0};
        var L2=netEval(q,Dx,null).loss;
        var d=Math.abs(L1-L2);
        if(d>worst)worst=d;
        n++;
      }
    }
    T(9,worst<=1e-12,'max |loss - loss(units permuted)| over '+n+' uniform networks = '+worst.toExponential(3));
  })();

  /* 10 - dead counter reads 3 when every relu unit is biased below -8 */
  (function(){
    var Dx=makeXOR(4242),net=netNew(7,[AI.relu,AI.relu,AI.relu],0,0.5);
    net.b1[0]=-9;net.b1[1]=-9;net.b1[2]=-9;
    var r=netEval(net,Dx,null);
    T(10,r.dead===3,'dead = '+r.dead+' with all three relu biases at -9');
  })();

  /* 11 - right end of the loss curve equals the loss readout (needs the live UI) */
  (function(){
    if(typeof env.histProbe!=='function'){T(11,false,'SKIPPED - no DOM (headless run); browser run tests this live');return;}
    var r=env.histProbe();
    T(11,r.ok,r.note);
  })();

  var np=0;
  for(i=0;i<R.length;i++){
    if(R[i].pass)np++;
    (R[i].pass?console.log:console.error).call(console,
      'invariant '+String(R[i].n).padStart(2,' ')+'  '+(R[i].pass?'PASS':'FAIL')+'  '+R[i].note);
  }
  console.log('invariants: '+np+'/'+R.length+' passed');
  return R;
}

return {
  mulberry32:mulberry32,gaussFrom:gaussFrom,ACTS:ACTS,AI:AI,SEED1:SEED1,
  makeData1:makeData1,makeXOR:makeXOR,makeCircles:makeCircles,
  p1Make:p1Make,p1Grad:p1Grad,p1Step:p1Step,p1Run:p1Run,p1Loss:p1Loss,
  p1SliceAt:p1SliceAt,p1Acc:p1Acc,p1MinZ:p1MinZ,gradBarFrac:gradBarFrac,bowlMarker:bowlMarker,
  LOSSN:LOSSN,lossVal:lossVal,lossDer:lossDer,netNew:netNew,netG:netG,netEval:netEval,
  netApply:netApply,netStep:netStep,netRun:netRun,netFwd:netFwd,
  runAssertions:runAssertions
};
})();
/*</CORE>*/
</script>
<script>
(function(){
'use strict';
var C=globalThis.CORE;

/* ---- palette: one accent, two class colours, achromatic everything else ---- */
var INK='#1a4d8f',C0='#c04a4a',BOUND='#191b1d';
var LINE='#e8ecf2',TICKC='#98a1af',AXC='#5b6472',PARA='#c7cdd6',TRAILC='176,186,200';
var PALE0='rgb(249,236,236)',PALE1='rgb(228,236,246)';
var MONOF='"Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,monospace';
var SERIFF='"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif';
var UIF='"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif';
var TICK='13px '+MONOF, AXL='italic 16px '+SERIFF, UNIT='600 10px '+UIF;
var DIALS=[1,10,100,1000,10000,100000],DIALN=['1','10','100','1k','10k','100k'];
var page=1;

/* ---------------- canvas helpers ---------------- */
function ctxOf(cv,cssH){
  var cssW=cv.clientWidth||600;
  var dpr=window.devicePixelRatio||1;
  cv.style.height=cssH+'px';
  var w=Math.round(cssW*dpr),h=Math.round(cssH*dpr);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,cssW,cssH);
  g.lineCap='round';g.lineJoin='round';
  g.W=cssW;g.H=cssH;
  return g;
}
function frameBox(g,x0,y0,x1,y1,r){
  r=(r===undefined)?10:r;
  g.beginPath();
  if(g.roundRect)g.roundRect(Math.round(x0)+0.5,Math.round(y0)+0.5,Math.round(x1-x0),Math.round(y1-y0),r);
  else g.rect(Math.round(x0)+0.5,Math.round(y0)+0.5,Math.round(x1-x0),Math.round(y1-y0));
  g.strokeStyle=LINE;g.lineWidth=1;g.stroke();
}
function clipRounded(g,x0,y0,w,h,r){
  g.beginPath();
  if(g.roundRect)g.roundRect(x0,y0,w,h,(r===undefined)?10:r);else g.rect(x0,y0,w,h);
  g.clip();
}
/* Largest scale that fills the rect: the longer side spans +/-R, the shorter side
   shows whatever fits, floored at YMIN so the data always clears the frame.
   All six panels share one rect, so all six share one pair of ranges. */
function fitRange(W,H,R,YMIN){
  var s=Math.max(W,H)/(2*R);
  var xr=W/(2*s),yr=H/(2*s);
  if(xr<YMIN||yr<YMIN){s=Math.min(W,H)/(2*YMIN);xr=W/(2*s);yr=H/(2*s);}
  return {xr:xr,yr:yr};
}
function rng(v){var r=Math.round(v);return Math.abs(v-r)<0.05?String(r):v.toFixed(1);}
function axesL(g,x0,y0,x1,y1){
  g.strokeStyle=LINE;g.lineWidth=1;g.lineCap='butt';
  g.beginPath();
  g.moveTo(Math.round(x0)+0.5,y0);g.lineTo(Math.round(x0)+0.5,Math.round(y1)+0.5);
  g.lineTo(x1,Math.round(y1)+0.5);
  g.stroke();g.lineCap='round';
}
function tx(g,s,x,y,font,col,al,bl){
  g.font=font;g.fillStyle=col;g.textAlign=al||'left';g.textBaseline=bl||'alphabetic';
  g.fillText(s,x,y);
}
function dot(g,x,y,r,col){
  g.beginPath();g.arc(x,y,r+2.2,0,6.2832);g.fillStyle='#fff';g.fill();
  g.beginPath();g.arc(x,y,r,0,6.2832);g.fillStyle=col;g.fill();
}
function fmtInt(n){
  if(n<1e4)return String(n);
  if(n<1e6)return (n/1e3).toFixed(n<1e5?1:0)+'k';
  return (n/1e6).toFixed(n<1e7?2:1)+'M';
}
function fmtEpoch(n){return n.toLocaleString('en-US');}

/* a*x + b*y = c, clipped to the box */
function lineSeg(a,b,c,x0,x1,y0,y1){
  var p=[],E=1e-9,t;
  if(Math.abs(b)>1e-13){
    t=(c-a*x0)/b;if(t>=y0-E&&t<=y1+E)p.push([x0,t]);
    t=(c-a*x1)/b;if(t>=y0-E&&t<=y1+E)p.push([x1,t]);
  }
  if(Math.abs(a)>1e-13){
    t=(c-b*y0)/a;if(t>=x0-E&&t<=x1+E)p.push([t,y0]);
    t=(c-b*y1)/a;if(t>=x0-E&&t<=x1+E)p.push([t,y1]);
  }
  if(p.length<2)return null;
  var bi=0,bj=1,bd=-1;
  for(var i=0;i<p.length;i++)for(var j=i+1;j<p.length;j++){
    var d=(p[i][0]-p[j][0])*(p[i][0]-p[j][0])+(p[i][1]-p[j][1])*(p[i][1]-p[j][1]);
    if(d>bd){bd=d;bi=i;bj=j;}
  }
  if(bd<1e-12)return null;
  return [p[bi][0],p[bi][1],p[bj][0],p[bj][1]];
}

/* ======================================================= PAGE 1 */
var SCEN=[
  {w1:1,w2:1,b:12,alpha:0.05,R:14,bmin:-6,bmax:14},
  {w1:0.5,w2:0.5,b:-3,alpha:0.05,R:9,bmin:-8,bmax:6}
];
var D1=C.makeData1(C.SEED1);
var P1={sc:0,view:0,dial:0,run:false,epoch:0,b:12,alpha:0.05,panels:[],histX:[],ch:340};
var SCRATCH=[0,0,0],SCRATCH2=[0,0,0];
var TRAILMAX=300;

function buildP1(){
  var grid=document.getElementById('grid1');
  grid.innerHTML='';
  for(var i=0;i<6;i++){
    var d=document.createElement('div');d.className='panel';
    d.innerHTML='<div class="ptitle"></div><canvas class="pc"></canvas>'+
      '<div class="row">'+
      '<span class="pair"><span class="k">ep</span><span class="v e"></span></span>'+
      '<span class="pair"><span class="k">acc</span><span class="v a"></span></span>'+
      '<span class="pair"><span class="k">loss</span><span class="v l"></span></span>'+
      '<span class="bar"><i></i></span></div>';
    grid.appendChild(d);
    d.querySelector('.ptitle').textContent=C.ACTS[i].name;
    P1.panels.push({ai:i,el:d,cv:d.querySelector('canvas'),
      eE:d.querySelector('.e'),eA:d.querySelector('.a'),eL:d.querySelector('.l'),
      eB:d.querySelector('.bar>i'),m:null,hist:[],trail:[],mtrail:[],loss0:1,st:null});
  }
  var dl=document.getElementById('dial1');
  for(i=0;i<6;i++){
    var b=document.createElement('button');b.className=(i===0?'on':'');b.textContent=DIALN[i];
    b.setAttribute('data-d',i);dl.appendChild(b);
  }
  dl.addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;
    P1.dial=+t.getAttribute('data-d');mark(dl,'button',t);
  });
}
function mark(root,sel,on){
  var ns=root.querySelectorAll(sel);
  for(var i=0;i<ns.length;i++)ns[i].classList.toggle('on',ns[i]===on);
}
function reset1(){
  var s=SCEN[P1.sc];
  P1.epoch=0;P1.histX.length=0;P1.histX.push(0);
  for(var i=0;i<6;i++){
    var p=P1.panels[i];
    p.m=C.p1Make(i,s.w1,s.w2,P1.b,P1.alpha);
    p.loss0=C.p1Loss(i,s.w1,s.w2,P1.b,D1);
    p.hist=[p.loss0];
    p.trail=[{w1:p.m.w1,w2:p.m.w2,b:p.m.b}];
    p.mtrail=[C.bowlMarker(p.loss0,p.loss0)];
  }
}
function tick1(){
  var i,p,N=DIALS[P1.dial];
  if(P1.run){
    for(i=0;i<6;i++)C.p1Run(P1.panels[i].m,D1,N,SCRATCH);
    P1.epoch+=N;
  }
  /* one metrics pass per frame; readout, history, bowl and slice all read it */
  for(i=0;i<6;i++){
    p=P1.panels[i];
    var m=p.m;
    C.p1Grad(m,D1,SCRATCH2);
    p.st={loss:C.p1Loss(m.ai,m.w1,m.w2,m.b,D1),
          acc:C.p1Acc(m.ai,m.w1,m.w2,m.b,D1),
          g:(Math.abs(SCRATCH2[0])+Math.abs(SCRATCH2[1]))/2};
  }
  if(P1.run){
    P1.histX.push(P1.epoch);
    for(i=0;i<6;i++){
      p=P1.panels[i];
      p.hist.push(p.st.loss);
      p.trail.push({w1:p.m.w1,w2:p.m.w2,b:p.m.b});
      if(p.trail.length>TRAILMAX)p.trail.shift();
      p.mtrail.push(C.bowlMarker(p.st.loss,p.loss0));
      if(p.mtrail.length>TRAILMAX)p.mtrail.shift();
    }
  }
  for(i=0;i<6;i++)drawPanel(P1.panels[i]);
}
function readout1(p){
  p.eE.textContent=fmtEpoch(P1.epoch);
  p.eA.textContent=p.st.acc.toFixed(2);
  p.eL.textContent=p.st.loss.toExponential(5);
  p.eB.style.width=(C.gradBarFrac(p.st.g)*100).toFixed(3)+'%';
}
function drawPanel(p){
  readout1(p);
  var g=ctxOf(p.cv,P1.ch);
  if(P1.view===0)drawBoundary(g,p);
  else if(P1.view===1)drawLossEpoch(g,p);
  else if(P1.view===2)drawBowl(g,p);
  else drawSlice(g,p);
}
function drawBoundary(g,p){
  var R=SCEN[P1.sc].R,ML=48,MR=14,MT=12,MB=30;
  var x0=ML,y0=MT,x1=g.W-MR,y1=g.H-MB,W=x1-x0,H=y1-y0;
  var fr=fitRange(W,H,R,4.6),xr=fr.xr,yr=fr.yr;
  var sx=function(x){return x0+(x+xr)/(2*xr)*W;},
      sy=function(y){return y1-(y+yr)/(2*yr)*H;};
  frameBox(g,x0,y0,x1,y1);
  g.save();clipRounded(g,x0,y0,W,H,10);
  var zs=C.ACTS[p.ai].zs,i,seg;
  g.lineWidth=1;
  for(i=0;i<p.trail.length;i++){
    var t=p.trail[i];
    seg=lineSeg(t.w1,t.w2,zs-t.b,-xr,xr,-yr,yr);
    if(!seg)continue;
    var al=0.05+0.40*(i/Math.max(1,p.trail.length-1));
    g.strokeStyle='rgba('+TRAILC+','+al.toFixed(3)+')';
    g.beginPath();g.moveTo(sx(seg[0]),sy(seg[1]));g.lineTo(sx(seg[2]),sy(seg[3]));g.stroke();
  }
  for(i=0;i<D1.n;i++){
    g.beginPath();g.arc(sx(D1.X1[i]),sy(D1.X2[i]),3,0,6.2832);
    g.fillStyle=D1.Y[i]===0?C0:INK;g.globalAlpha=0.8;g.fill();g.globalAlpha=1;

/* --- network diagram --- */
var DW=840,DH=440,RAD=48;
var NP=[{x:80,y:152},{x:80,y:308},{x:410,y:74},{x:410,y:220},{x:410,y:366},{x:740,y:220}];
function miniCurve(g,cx,cy,ai){
  var A=C.ACTS[ai],k,lo=Infinity,hi=-Infinity,vs=[];
  for(k=0;k<=64;k++){var z=-3+6*k/64,v=A.f(z);vs.push(v);if(v<lo)lo=v;if(v>hi)hi=v;}
  var pad=(hi-lo)*0.14||0.1;lo-=pad;hi+=pad;
  var X0=cx+5,X1=cx+RAD-8,Y0=cy+RAD-12,Y1=cy-RAD+12;
  var mx=function(z){return X0+(z+3)/6*(X1-X0);},
      my=function(v){return Y0+(v-lo)/(hi-lo)*(Y1-Y0);};
  if(lo<0&&hi>0){
    g.strokeStyle='#ececea';g.lineWidth=1;
    g.beginPath();g.moveTo(X0,my(0));g.lineTo(X1,my(0));g.stroke();
  }
  g.strokeStyle=INK;g.lineWidth=2.4;g.beginPath();
  for(k=0;k<=64;k++){
    var zz=-3+6*k/64;
    if(k===0)g.moveTo(mx(zz),my(vs[k]));else g.lineTo(mx(zz),my(vs[k]));
  }
  g.stroke();
}
function neuron(g,cx,cy,kind,ai,lab,hot){
  g.beginPath();g.arc(cx,cy,RAD,0,6.2832);
  g.fillStyle='#fff';g.fill();
  g.strokeStyle=hot?INK:'#d9d9d4';g.lineWidth=hot?2:1.4;g.stroke();
  if(kind==='in'){tx(g,lab,cx,cy+1,'italic 23px '+SERIFF,'#16181a','center','middle');return;}
  g.beginPath();g.moveTo(cx,cy-RAD+3);g.lineTo(cx,cy+RAD-3);
  g.strokeStyle='#ececea';g.lineWidth=1;g.stroke();
  tx(g,'Σ',cx-RAD/2,cy+1,'29px '+SERIFF,'#16181a','center','middle');
  g.save();
  g.beginPath();g.arc(cx,cy,RAD-1.5,0,6.2832);g.clip();
  g.beginPath();g.rect(cx,cy-RAD,RAD,2*RAD);g.clip();
  miniCurve(g,cx,cy,ai);
  g.restore();
}
function caption(g,cx,cy,name,bias){
  g.font='13px '+MONOF;
  var wn=g.measureText(name).width,wb=g.measureText(bias).width,gp=11;
  var x=cx-(wn+gp+wb)/2,y=cy+RAD+19;
  tx(g,name,x,y,'13px '+MONOF,'#6b7075','left','middle');
  tx(g,bias,x+wn+gp,y,'13px '+MONOF,'#adb2b8','left','middle');
}
function chip(g,x,y,s){
  g.font='13px '+MONOF;
  var wd=g.measureText(s).width,pw=wd+12,ph=19;
  g.beginPath();
  if(g.roundRect)g.roundRect(x-pw/2,y-ph,pw,ph,5);
  else g.rect(x-pw/2,y-ph,pw,ph);
  g.fillStyle='#fff';g.fill();
  g.strokeStyle='#eeeeea';g.lineWidth=1;g.stroke();
  tx(g,s,x,y-ph/2+0.5,'13px '+MONOF,'#5b6066','center','middle');
}
function edge(g,ax,ay,bx,by,wv){
  var a=Math.min(1,Math.abs(wv)/3.2);
  g.strokeStyle='rgba(150,154,160,'+(0.22+0.5*a).toFixed(3)+')';
  g.lineWidth=0.9+1.9*a;
  g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.stroke();
}
function drawDiag(){
  var cv=document.getElementById('diag');
  var cssW=cv.clientWidth||840,sc=cssW/DW;
  var g=ctxOf(cv,DH*sc);
  g.scale(sc,sc);
  var net=P2.net,i,j;
  for(i=0;i<2;i++)for(j=0;j<3;j++)
    edge(g,NP[i].x+RAD,NP[i].y,NP[2+j].x-RAD,NP[2+j].y,net.W1[j][i]);
  for(j=0;j<3;j++)
    edge(g,NP[2+j].x+RAD,NP[2+j].y,NP[5].x-RAD,NP[5].y,net.W2[j]);
  for(i=0;i<2;i++)for(j=0;j<3;j++){
    var t=0.55+0.10*i+0.06*j;
    chip(g,NP[i].x+RAD+(NP[2+j].x-RAD-NP[i].x-RAD)*t,
           NP[i].y+(NP[2+j].y-NP[i].y)*t,net.W1[j][i].toFixed(2));
  }
  for(j=0;j<3;j++){
    var t2=0.30+0.14*j;
    chip(g,NP[2+j].x+RAD+(NP[5].x-RAD-NP[2+j].x-RAD)*t2,
           NP[2+j].y+(NP[5].y-NP[2+j].y)*t2,net.W2[j].toFixed(2));
  }
  neuron(g,NP[0].x,NP[0].y,'in',0,'x₁');
  neuron(g,NP[1].x,NP[1].y,'in',0,'x₂');
  for(j=0;j<3;j++){
    neuron(g,NP[2+j].x,NP[2+j].y,'h',net.acts[j],'',P2.hover===j);
    caption(g,NP[2+j].x,NP[2+j].y,C.ACTS[net.acts[j]].name,'b '+net.b1[j].toFixed(2));
    tx(g,'U'+(j+1),NP[2+j].x-RAD-6,NP[2+j].y-RAD+4,UNIT,'#b6bbc0','right','middle');
  }
  neuron(g,NP[5].x,NP[5].y,'h',C.AI.sigmoid);
  caption(g,NP[5].x,NP[5].y,'sigmoid','b '+net.b2.toFixed(2));
  tx(g,'ŷ',NP[5].x+RAD+16,NP[5].y,'italic 21px '+SERIFF,'#16181a','left','middle');
}

var GN=170,OFF=null;
function drawSurf(){
  var cv=document.getElementById('surf');
  var cssW=cv.clientWidth||520;
  var ML=42,MR=14,MT=12,MB=30;
  var W=cssW-ML-MR,H=Math.min(W,P2.ch);
  var g=ctxOf(cv,H+MT+MB);
  var x0=ML,y0=MT,x1=x0+W,y1=y0+H,R=5;
  var fr=fitRange(W,H,R,R),xr=fr.xr,yr=fr.yr;   /* the whole +/-5 window always shows */
  var GH=Math.max(40,Math.round(GN*H/W));
  if(!OFF||OFF.width!==GN||OFF.height!==GH){
    OFF=document.createElement('canvas');OFF.width=GN;OFF.height=GH;}
  var oc=OFF.getContext('2d'),img=oc.createImageData(GN,GH),d=img.data;
  var net=P2.net,gx,gy;
  for(gy=0;gy<GH;gy++){
    var wy=yr-2*yr*(gy+0.5)/GH;
    for(gx=0;gx<GN;gx++){
      var wx=-xr+2*xr*(gx+0.5)/GN;
      var pr=C.netFwd(net,wx,wy),o=(gy*GN+gx)*4;
      if(pr>0.5){d[o]=227;d[o+1]=234;d[o+2]=243;}
      else{d[o]=247;d[o+1]=233;d[o+2]=233;}
      d[o+3]=255;
    }
  }
  oc.putImageData(img,0,0);
  g.imageSmoothingEnabled=true;
  g.save();clipRounded(g,x0,y0,W,H,10);
  g.drawImage(OFF,0,0,GN,GH,x0,y0,W,H);
  var sx=function(x){return x0+(x+xr)/(2*xr)*W;},sy=function(y){return y1-(y+yr)/(2*yr)*H;};
  for(var i=0;i<D2.n;i++){
    g.beginPath();g.arc(sx(D2.X1[i]),sy(D2.X2[i]),3.2,0,6.2832);
    g.fillStyle=D2.Y[i]===0?C0:INK;g.fill();
    g.lineWidth=1.1;g.strokeStyle='rgba(255,255,255,.85)';g.stroke();
  }
  g.restore();
  frameBox(g,x0,y0,x1,y1);
  tx(g,'−'+rng(xr),x0+3,y1+9,TICK,TICKC,'left','top');
  tx(g,'+'+rng(xr),x1-3,y1+9,TICK,TICKC,'right','top');
  tx(g,'−'+rng(yr),x0-9,y1,TICK,TICKC,'right','middle');
  tx(g,'+'+rng(yr),x0-9,y0,TICK,TICKC,'right','middle');
}
function drawStrip(){

/* --- ten seeds --- */
function run10(){
  var res=[],solved=0,k,e;
  for(k=0;k<10;k++){
    var net=C.netNew(P2.seed+k,P2.acts,P2.lossType,ALPHA2);
    if(P2.preset===2)net.b1[0]=-8;
    var G=C.netG(),hit=-1;
    for(e=0;e<5000;e++){
      var r=C.netEval(net,D2,G);
      if(r.acc===1){hit=e;break;}
      C.netApply(net,G);
    }
    if(hit>=0){solved++;res.push(hit);}
  }
  res.sort(function(a,b){return a-b;});
  var med='—';
  if(res.length)med=String(res.length%2?res[(res.length-1)/2]:Math.round((res[res.length/2-1]+res[res.length/2])/2));
  document.getElementById('p2out').textContent='solved '+solved+'/10, median '+med+' epochs';
}

function layout(){
  var h=window.innerHeight,budget=Math.round((h-300)/2);
  if(P1.panels.length&&document.getElementById('page1').style.display!=='none'){
    var el=P1.panels[0].el,cv=P1.panels[0].cv,grid=document.getElementById('grid1');
    var top=0,n=grid;while(n){top+=n.offsetTop;n=n.offsetParent;}
    var gap=parseFloat(getComputedStyle(grid).rowGap)||16;
    var extra=el.offsetHeight-cv.offsetHeight;   /* card padding + title + readout */
    if(extra>20&&top>40)budget=Math.floor((h-top-gap-36-2*extra)/2);
  }
  P1.ch=Math.max(190,Math.min(560,budget));
  P2.ch=Math.max(280,Math.min(760,h-330));
}
function showPage(n){
  page=n;

function wire(){
  document.getElementById('tab1').onclick=function(){showPage(1);};
  document.getElementById('tab2').onclick=function(){showPage(2);};

  var bar=document.querySelectorAll('#page1 .ctl')[0];
  bar.addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;
    if(t.hasAttribute('data-sc')){
      P1.sc=+t.getAttribute('data-sc');
      var s=SCEN[P1.sc];
      P1.b=s.b;P1.alpha=s.alpha;syncSliders();
      P1.run=false;reset1();syncRun();
      mark(t.parentNode,'button',t);
    }else if(t.hasAttribute('data-v')){
      setView(+t.getAttribute('data-v'));
      mark(t.parentNode,'button',t);
    }
  });
  document.getElementById('play1').onclick=function(){P1.run=true;syncRun();};
  document.getElementById('pause1').onclick=function(){P1.run=false;syncRun();};
  document.getElementById('reset1').onclick=function(){P1.run=false;reset1();syncRun();};

  var sb=document.getElementById('sb'),sa=document.getElementById('sa');
  sb.oninput=function(){P1.b=+sb.value;document.getElementById('sbv').textContent=P1.b.toFixed(1);
    P1.run=false;reset1();syncRun();};
  sa.oninput=function(){P1.alpha=+sa.value;document.getElementById('sav').textContent=P1.alpha.toFixed(3);
    for(var i=0;i<6;i++)P1.panels[i].m.alpha=P1.alpha;};

  var dl2=document.getElementById('dial2');
  for(var i=0;i<6;i++){
    var b=document.createElement('button');b.className=(i===0?'on':'');b.textContent=DIALN[i];
    b.setAttribute('data-d',i);dl2.appendChild(b);
  }
  dl2.addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;
    P2.dial=+t.getAttribute('data-d');mark(dl2,'button',t);
  });
  document.getElementById('play2').onclick=function(){P2.run=true;syncRun();};
  document.getElementById('pause2').onclick=function(){P2.run=false;syncRun();};
  document.getElementById('reset2').onclick=function(){P2.run=false;reset2();syncRun();};
  var pres=[[1,1,1],[3,3,3],[3,3,3],[3,1,5]];
  document.querySelectorAll('[data-pre]').forEach(function(bt){
    bt.onclick=function(){
      var k=+bt.getAttribute('data-pre');
      P2.preset=k;P2.acts=pres[k].slice();P2.run=false;reset2();syncRun();
      mark(bt.parentNode,'button',bt);
    };
  });
  document.querySelectorAll('input[name=lt]').forEach(function(r){
    r.onchange=function(){P2.lossType=+r.value;P2.run=false;reset2();syncRun();};
  });
  document.getElementById('ds').onchange=function(){
    P2.ds=+this.value;
    D2=P2.ds===0?C.makeXOR(DSEED):C.makeCircles(DSEED);
    P2.run=false;reset2();syncRun();
  };
  document.getElementById('reseed').onclick=function(){P2.seed++;P2.run=false;reset2();syncRun();};
  document.getElementById('run10').onclick=run10;
  var dg=document.getElementById('diag');
  dg.addEventListener('mousedown',diagClick);
  dg.addEventListener('mousemove',diagMove);
  dg.addEventListener('mouseleave',function(){P2.hover=-1;});
  window.addEventListener('resize',layout);
  window.addEventListener('keydown',function(ev){
    if(ev.target.tagName==='INPUT'||ev.target.tagName==='SELECT')return;
    if(ev.code==='Space'){ev.preventDefault();
      if(page===1)P1.run=!P1.run;else P2.run=!P2.run;syncRun();}
    else if(ev.key==='r'||ev.key==='R'){
      if(page===1){P1.run=false;reset1();}else{P2.run=false;reset2();}syncRun();}
  });
}
function syncSliders(){
  var sb=document.getElementById('sb'),sa=document.getElementById('sa');
  sb.value=P1.b;sa.value=P1.alpha;
  document.getElementById('sbv').textContent=P1.b.toFixed(1);
  document.getElementById('sav').textContent=P1.alpha.toFixed(3);
}
function buildBars(){
  var e=document.getElementById('p2bars');
  e.innerHTML='';
  for(var j=0;j<3;j++){
    var d=document.createElement('div');d.className='u';
    d.innerHTML='<span class="k">u'+(j+1)+'</span><span class="bar"><i></i></span>';
    e.appendChild(d);
  }
}
function loop(){
  if(page===1)tick1();else tick2();
  requestAnimationFrame(loop);
}

/* ---- invariant probes that need the live UI ---- */
function viewProbe(){
  var snap=[],i,v;
  for(i=0;i<6;i++){var m=P1.panels[i].m;snap.push([m.w1,m.w2,m.b,m.epoch]);}
  var e0=P1.epoch,v0=P1.view,bad=0;
  for(v=0;v<4;v++){
    setView(v);
    for(i=0;i<6;i++){
      var q=P1.panels[i].m,s=snap[i];
      if(q.w1!==s[0]||q.w2!==s[1]||q.b!==s[2]||q.epoch!==s[3])bad++;
    }
    if(P1.epoch!==e0)bad++;
  }
  setView(v0);
  return {ok:bad===0,note:'cycled BOUNDARY / LOSS vs EPOCH / LOSS BOWL / LOSS SLICE; epoch and all 6 weight triples bit-identical (mismatches='+bad+')'};
}
function histProbe(){
  var keepR=P2.run;P2.run=false;
  reset2();
  for(var k=0;k<12;k++){
    C.netEval(P2.net,D2,P2.G);C.netApply(P2.net,P2.G);
    p2Metrics();p2Record();
  }
  var last=P2.hist[P2.hist.length-1],shown=P2.stat.loss;
  var d=Math.abs(last-shown);
  reset2();P2.run=keepR;
  return {ok:P2.hist.length>0&&d<=1e-12,
    note:'right end of the loss curve vs the loss readout: |diff| = '+d.toExponential(3)+' (single shared value)'};
}

/* ---- boot ---- */
buildP1();
layout();
buildMenu();
buildBars();
P1.b=SCEN[0].b;P1.alpha=SCEN[0].alpha;
syncSliders();
reset1();
reset2();
wire();
document.querySelector('[data-pre="3"]').classList.add('on');
showPage(1);
requestAnimationFrame(loop);
setTimeout(function(){C.runAssertions({viewProbe:viewProbe,histProbe:histProbe});},80);
})();
</script>
</body>
